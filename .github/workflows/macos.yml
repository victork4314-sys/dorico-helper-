name: macOS build and tests

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test core and compile native target
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test.log
      - name: Build native app
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee swift-build.log
      - name: Package executable
        run: |
          mkdir -p artifact
          cp .build/release/DoricoXboxBridge artifact/
          cp README.md artifact/
          ditto -c -k --sequesterRsrc --keepParent artifact DoricoXboxBridge-macOS.zip
      - name: Upload compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DoricoXboxBridge-compiler-logs
          path: |
            swift-test.log
            swift-build.log
          if-no-files-found: ignore
      - name: Upload native build
        uses: actions/upload-artifact@v4
        with:
          name: DoricoXboxBridge-macOS
          path: DoricoXboxBridge-macOS.zip
