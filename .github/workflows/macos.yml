name: macOS build and tests

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Verify controller routing safety rails
        run: bash scripts/verify-controller-routing.sh
      - name: Test core and compile native target
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test.log
      - name: Build and triple-verify Universal 2 app, ZIP, and DMG
        run: |
          set -o pipefail
          SOURCE_COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" \
          SKIP_TESTS=1 \
          BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
          bash scripts/build-app.sh 2>&1 | tee app-package.log
      - name: Upload compiler and packaging logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DoricoXboxBridge-build-logs
          path: |
            swift-test.log
            app-package.log
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload native app installers and verification records
        uses: actions/upload-artifact@v4
        with:
          name: DoricoXboxBridge-macOS-Universal
          path: |
            dist/Dorico-Xbox-Bridge-macOS-Universal.zip
            dist/Dorico-Xbox-Bridge-macOS-Universal.dmg
            dist/BUILD-MANIFEST.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
