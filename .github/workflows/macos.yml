name: macOS build and tests

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test core and compile native target
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test.log
      - name: Build native app
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee swift-build.log
      - name: Package app bundle and DMG
        run: |
          chmod +x scripts/package-app.sh
          scripts/package-app.sh .build/release/DoricoXboxBridge dist
      - name: Upload compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DoricoXboxBridge-compiler-logs
          path: |
            swift-test.log
            swift-build.log
          if-no-files-found: ignore
      - name: Upload native build
        uses: actions/upload-artifact@v4
        with:
          name: DoricoXboxBridge-macOS
          path: |
            dist/DoricoXboxBridge-macOS.zip
            dist/DoricoXboxBridge-macOS.dmg
